name: CI Pipeline
on:
  push:
    branches: [ main, feature/event-crud ]
  pull_request:
    branches: [ main, feature/event-crud ]

jobs:
  build-and-test:
    name: Build & Test
    # TODO: change to self-hosted once EC2 runner is registered
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

